<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>鸠江水位小助手 - {% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* 护眼灰背景 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #e5e7eb;
        }

        ::-webkit-scrollbar-thumb {
            background: #9ca3af;
            border-radius: 4px;
        }
    </style>
</head>

<body class="text-slate-700 antialiased">

    <!-- 顶部导航：深色 Slate-800 -->
    <header class="sticky top-0 z-50 bg-slate-800 shadow-lg">
        <div class="container mx-auto px-6">
            <!-- 第一行：Logo -->
            <div class="flex items-center justify-between py-4">
                <div class="flex items-center space-x-4">
                    <div class="bg-blue-600 p-2 rounded-lg shadow-md">
                        <span class="text-2xl text-white">💧</span>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-white tracking-wide">鸠江水位小助手</h1>
                        <p class="text-xs text-slate-400">鸠江区防汛小工具</p>
                    </div>
                </div>
                <div></div>
            </div>

            <!-- 第二行：导航链接 -->
            <nav class="flex space-x-8 pb-3">
                <a href="/" class="nav-link relative whitespace-nowrap px-1 py-2 text-sm font-medium transition-colors duration-300 
                    {% if request.path == '/' %}text-white{% else %}text-slate-400 hover:text-white{% endif %}">
                    主页
                    {% if request.path == '/' %}<div
                        class="absolute bottom-[-1px] left-0 right-0 h-0.5 bg-blue-500 rounded-full"></div>{% endif %}
                </a>
                <a href="/plan" class="nav-link relative whitespace-nowrap px-1 py-2 text-sm font-medium transition-colors duration-300 
                    {% if request.path == '/plan' %}text-white{% else %}text-slate-400 hover:text-white{% endif %}">
                    开发计划
                    {% if request.path == '/plan' %}<div
                        class="absolute bottom-[-1px] left-0 right-0 h-0.5 bg-blue-500 rounded-full"></div>{% endif %}
                </a>
                <a href="/history" class="nav-link relative whitespace-nowrap px-1 py-2 text-sm font-medium transition-colors duration-300 
                    {% if request.path == '/history' %}text-white{% else %}text-slate-400 hover:text-white{% endif %}">
                    开发历程
                    {% if request.path == '/history' %}<div
                        class="absolute bottom-[-1px] left-0 right-0 h-0.5 bg-blue-500 rounded-full"></div>{% endif %}
                </a>
            </nav>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="container mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- 页尾 -->
    <footer class="bg-slate-800 border-t border-slate-700 mt-12">
        <div class="container mx-auto px-6 py-4 text-center text-sm text-slate-500">
            Copyright @ 2026 鸠江水位小助手 | 阮福民 版权所有
        </div>
    </footer>
</body>

</html>
