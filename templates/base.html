<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鸠江水位小助手 - {% block title %}{% endblock %}</title>
    <!-- Tailwind CDN (开发环境最快用法) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <!-- 页头 -->
    <header class="bg-gradient-to-r from-blue-700 to-blue-900 text-white shadow-lg">
        <div class="container mx-auto px-6 py-5">
            <h1 class="text-3xl font-bold">鸠江水位小助手</h1>
            <p class="text-sm text-blue-200 mt-1">鸠江区防汛小工具</p>
        </div>
    </header>

    <!-- 导航 -->
    <nav class="bg-white shadow sticky top-0 z-50">
        <div class="container mx-auto px-6 py-3 flex space-x-8">
            <a href="/"
                class="py-2 px-4 rounded-md hover:bg-blue-50 {% if request.path == '/' %}text-blue-700 font-semibold border-b-2 border-blue-700{% else %}text-gray-600{% endif %}">主页</a>
            <a href="/plan"
                class="py-2 px-4 rounded-md hover:bg-blue-50 {% if request.path == '/plan' %}text-blue-700 font-semibold border-b-2 border-blue-700{% else %}text-gray-600{% endif %}">开发计划</a>
            <a href="/history"
                class="py-2 px-4 rounded-md hover:bg-blue-50 {% if request.path == '/history' %}text-blue-700 font-semibold border-b-2 border-blue-700{% else %}text-gray-600{% endif %}">开发历程</a>
        </div>
    </nav>

    <!-- 主体内容 -->
    <main class="flex-grow container mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- 页尾 -->
    <footer class="bg-gray-800 text-white mt-auto">
        <div class="container mx-auto px-6 py-4 text-center text-sm text-gray-400">
            Copyright @ 2026 鸠江水位小助手 | 阮福民 版权所有
        </div>
    </footer>
</body>

</html>
